name: Yeezy restock watch

on:
  schedule:
    # Hourly, not */5. Measured over 36 hours, a */5 cron on this repo
    # delivered 68 of a possible 415 runs: median 30 minutes between checks,
    # worst case 91. GitHub's scheduler is best effort and it deprioritises
    # high frequency schedules.
    #
    # So stop asking the scheduler for favours 288 times a day. Ask once an
    # hour, and let the job itself stay alive and do the 5 minute polling on
    # the runner's own clock. GitHub can delay starting a job, but it cannot
    # interrupt one that is already running.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = look for a restock. test-email = prove the sender works."
        type: choice
        default: check
        options:
          - check
          - test-email

# Never let two checks overlap. Two runs racing would both read the same
# seen.json and could send the same alert twice, or clash on the push.
concurrency:
  group: restock-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run the tests before the check. A broken regex would otherwise fail
      # silently: the bot would look healthy in the logs and match nothing.
      - name: Run tests
        run: python test_matching.py

      # A watcher that cannot email is worse than no watcher: it reports
      # success every hour while being incapable of telling you anything.
      # That is exactly what this repo did until 2026-08-22, when the secrets
      # turned out never to have been set. Fail loudly instead.
      - name: Verify the sender is configured
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          missing=""
          [ -z "$SMTP_USER" ]     && missing="$missing SMTP_USER"
          [ -z "$SMTP_PASSWORD" ] && missing="$missing SMTP_PASSWORD"
          [ -z "$ALERT_EMAIL" ]   && missing="$missing ALERT_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo ""
            echo "This watcher cannot send email, so it cannot alert you."
            echo "Set them under Settings > Secrets and variables > Actions."
            echo "SMTP_PASSWORD must be a Google app password, not the"
            echo "account password: https://myaccount.google.com/apppasswords"
            exit 1
          fi
          echo "Sender configured. Alerts will go to a configured address."

      # Runs the bot's normal watch loop for 50 minutes, checking every 5,
      # then exits so the state file can be committed before the next hour's
      # job takes over. 50 rather than 55 leaves slack: if GitHub starts this
      # job late, it still finishes before the next trigger and the two do
      # not queue up behind the concurrency group.
      #
      # Alerts email the instant they are found, mid-run. The state commit at
      # the end is only for dedup, so a crashed job costs at most a duplicate
      # email, never a missed one.
      - name: Watch for a restock
        if: inputs.mode != 'test-email'
        env:
          EMAIL_BACKEND: smtp
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          INTERVAL_SECONDS: "300"
          # State lives in a tracked directory so it survives between runs.
          # Each run is a fresh machine, so anything not committed is lost.
          STATE_DIR: state
        run: |
          set +e
          timeout 3000 python restock_bot.py
          code=$?
          set -e
          # 124 is timeout doing its job, which is the normal way this ends.
          # Anything else non-zero is a real crash and should fail loudly
          # rather than leave a dead watcher looking healthy.
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            echo "restock_bot exited $code"
            exit "$code"
          fi
          echo "Watch window complete."

      # The sender is the one part the scheduled run never exercises: state
      # commits happen whether or not email works, and alerts only fire on a
      # match. A dead SMTP password would look exactly like a healthy bot
      # right up until the drop. Run this by hand to prove otherwise.
      - name: Send a test email
        if: inputs.mode == 'test-email'
        env:
          EMAIL_BACKEND: smtp
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python restock_bot.py --test

      - name: Persist seen state
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore: update seen state [skip ci]"
            # Another run may have pushed while this one was working.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No state change, nothing to commit."
          fi
